version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: estoque_db
    environment:
      POSTGRES_USER: estoque_user
      POSTGRES_PASSWORD: senha_segura_aqui
      POSTGRES_DB: controle_estoque
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estoque_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: estoque_backend
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://estoque_user:senha_segura_aqui@postgres:5432/controle_estoque
      JWT_SECRET: ${JWT_SECRET}
      SENTRY_DSN: ${SENTRY_DSN}
      FRONTEND_URL: http://localhost:3000
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: estoque_frontend
    environment:
      VITE_API_URL: http://localhost:3001/api/v1
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data: